<!DOCTYPE html>
<html lang="en">

<head>

<body id="body_comentario">

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary d-flex m-0">

                <a class="navbar-brand" href="#">

                </a>
                <a class="navbar-brand" href="#">AC Fórum</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"

                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">

                        </li>

                    <form class="d-flex" role="search">

                    </form>
                    <div id="logout_button_div">

    <main>
        <section class="d-flex justify-content-center">
            <div id="comentarios">

                <div id="div_comentarios">
                    <div class="comentario_alheio">
                        <div class="d-flex">
                            <img class="circulo" src="assets/images/usuario_1.png" alt="Foto do Dava">
                            <textarea disabled
                                class="comentario">Meu a geometria desse novo assassin's esta demasiada deleciosa!!</textarea>
                        </div>
                    </div>
                    <div class="comentario_alheio">
                        <div class="d-flex">
                            <img class="circulo" src="assets/images/usuario_2.png" alt="Foto do Dava">
                            <textarea disabled
                                class="comentario">Oi eu quero conversar!</textarea>
                        </div>
                    </div>
                    <div class="comentario_alheio">
                        <div class="d-flex">
                            <img class="circulo" src="assets/images/usuario_3.png" alt="Foto do Dava">
                            <textarea disabled
                                class="comentario">kkkkkkkkkkkkkkkkkkkk seus noia</textarea>

                    </div>
                    <div class="comentario_alheio">
                        <div class="d-flex">

                                class="comentario">parem de mandar mensagem aqui porfavor</textarea>
                        </div>
                    </div>
                    <div class="comentario_alheio">
                        <div class="d-flex">
                            <img class="circulo" src="assets/noticias/noticia_4.png" alt="Foto do Dava">
                            <textarea disabled
                                class="comentario">Joguei Todos, Zerei Todos, essa é a diferença de um fã para um fanboy</textarea>
                        </div>
                    </div>
                </div>


                <div id="div_form_comentario">
                    <form id="mandar_comentario">
                        <div id="com_personalizado">
                            <textarea id="personalizado" placeholder="Comentário:"></textarea>
                            <div id="botao_comentario">
                                <button type="submit" class="btn btn-primary"
                                    style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">
                                    Comentar
                                </button>
                            </div>
                        </div>
                    </form>
                </div>


            </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
