<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login para forum do Assassin's Creed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/images/icone_navegador.png">
</head>

<body id="body1">

    <header></header>

    <main>
        <section>
            <div class="d-flex justify-content-center">
                <img id="" class="m-5 img-fluid image" src="assets/images/Assassin's_Creed_Logo.png"
                    alt="Logo do Assasins Creed">
            </div>
        </section>

        <div id="container-login"
            class="container-xxl pb-4 pt-5 shadow-lg p-3 mb-5 m-20 bg-body-tertiary rounded-1 position-form translate-middle">
            <form id="form-login" class="needs-validation" novalidate action="">
                <p class="h2 pb-3 d-flex justify-content-center">Login</p>
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuário:</label>
                    <input type="text" class="form-control" id="usuario" placeholder="Usuário" required>
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha:</label>
                    <input type="password" class="form-control" id="senha" placeholder="Senha" required>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" type="submit">Entrar</button>
                    <div id="mensagem">
                        <p>erro</p>
                    </div>
                </div>
            </form>

        </div>


    </main>

    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="scripts/script.js"></script>
</body>


</html>
